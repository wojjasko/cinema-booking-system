<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${screening.movie.title} + ' - Wybór Miejsc'">Wybór Miejsc</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #06040a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .navbar {
            background-color: rgba(20, 16, 38, 0.9);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }
        .navbar-brand { font-size: 26px; font-weight: bold; color: #ffc107; text-decoration: none; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-btn { color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; background-color: rgba(255, 255, 255, 0.1); transition: all 0.2s; }
        .nav-btn:hover { background-color: rgba(255, 255, 255, 0.25); }

        .container { max-width: 900px; margin: 0 auto; background: rgba(30, 26, 54, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); padding: 35px; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); backdrop-filter: blur(10px); text-align: center; }

        .screen { background: linear-gradient(180deg, #ffc107 0%, rgba(255, 193, 7, 0.1) 100%); color: #120e24; padding: 8px; margin-bottom: 35px; border-radius: 6px; font-weight: bold; letter-spacing: 4px; box-shadow: 0 4px 20px rgba(255, 193, 7, 0.3); }
        .screen-grid { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-bottom: 35px; }
        .seat-row { display: flex; gap: 10px; align-items: center; }
        .row-label { font-weight: bold; width: 70px; text-align: right; margin-right: 10px; color: #a0a0c0; }

        .seat-box { width: 38px; height: 38px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; color: white; cursor: pointer; transition: all 0.2s ease; }
        .free { background-color: #28a745; border: 1px solid rgba(255, 255, 255, 0.1); }
        .free:hover { transform: scale(1.1); box-shadow: 0 0 12px rgba(40, 167, 69, 0.6); }
        .occupied { background-color: #dc3545; cursor: not-allowed; opacity: 0.5; }
        .selected { background-color: #ffc107; color: #120e24; box-shadow: 0 0 14px rgba(255, 193, 7, 0.8); transform: scale(1.1); }

        .btn-submit { background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%); color: white; border: none; padding: 14px 28px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3); }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(40, 167, 69, 0.5); }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/" class="navbar-brand">🎬 MojeKino</a>
    <div class="nav-links">
        <a href="/" class="nav-btn">← Powrót do Repertuaru</a>
    </div>
</div>

<div class="container">
    <h1 th:text="${screening.movie.title}">Tytuł Filmu</h1>
    <p style="color: #a0a0c0;">Sala: <strong style="color: #fff;" th:text="${screening.cinemaHall.name}">Sala 1</strong> | Godzina: <strong style="color: #fff;" th:text="${#temporals.format(screening.startTime, 'HH:mm')}">18:00</strong></p>

    <div class="screen">EKRAN KINOWY</div>

    <form th:action="@{/reserve}" method="post" id="reservationForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <input type="hidden" name="screeningId" th:value="${screening.id}">

        <div class="screen-grid">
            <div th:each="rowNum : ${#numbers.sequence(1, screening.cinemaHall.totalRows)}" class="seat-row">
                <span class="row-label" th:text="'Rząd ' + ${rowNum}">Rząd 1</span>

                <th:block th:each="seat : ${seats}" th:if="${seat.rowNumber == rowNum}">
                    <div class="seat-box"
                         th:classappend="${#sets.contains(occupiedSeatIds, seat.id)} ? 'occupied' : 'free'"
                         th:data-id="${seat.id}"
                         onclick="toggleSeat(this)"
                         th:text="${seat.seatNumber}">
                        1
                    </div>
                </th:block>
            </div>
        </div>

        <div id="hiddenSeatsContainer"></div>
        <button type="submit" class="btn-submit">Zarezerwuj</button>
    </form>
</div>

<script>
    const selectedSeatIds = new Set();

    function toggleSeat(element) {
        if (element.classList.contains('occupied')) return;

        const seatId = element.getAttribute('data-id');
        if (selectedSeatIds.has(seatId)) {
            selectedSeatIds.delete(seatId);
            element.classList.remove('selected');
        } else {
            selectedSeatIds.add(seatId);
            element.classList.add('selected');
        }
        updateHiddenInputs();
    }

    function updateHiddenInputs() {
        const container = document.getElementById('hiddenSeatsContainer');
        container.innerHTML = '';
        selectedSeatIds.forEach(id => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'seatIds';
            input.value = id;
            container.appendChild(input);
        });
    }
</script>
</body>
</html>
