# profile "test" - turned on in test by @ActiveProfiles("test')
# separated database, so the test are never touching the data from main database (cinemadb)
# the database need to be created once:  CREATE DATABASE cinemadb_test;
# login and password are the same as in application.properties
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/cinemadb_test}

# tables are created at the start of tests and deleted as soon as they are done
spring.jpa.hibernate.ddl-auto=create-drop

# quiet logs in tests
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
