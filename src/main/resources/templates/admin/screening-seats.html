<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Podgląd Sali - Panel Admina</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #06040a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding-bottom: 50px;
            text-align: center;
        }

        .container { max-width: 950px; margin: 40px auto; background: rgba(30, 26, 54, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); padding: 35px; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .screen { background: linear-gradient(180deg, #ffc107 0%, rgba(255, 193, 7, 0.1) 100%); color: #120e24; padding: 8px; margin-bottom: 35px; border-radius: 6px; font-weight: bold; letter-spacing: 4px; box-shadow: 0 4px 20px rgba(255, 193, 7, 0.3); }
        .screen-grid { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-bottom: 35px; }
        .seat-row { display: flex; gap: 10px; align-items: center; }
        .row-label { font-weight: bold; width: 70px; text-align: right; margin-right: 10px; color: #a0a0c0; }

        .seat-wrapper { position: relative; display: inline-block; }
        .seat-box { width: 38px; height: 38px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; color: white; transition: all 0.2s ease; }
        .free { background-color: #28a745; cursor: default; }
        .occupied { background-color: #dc3545; cursor: pointer; }
        .occupied:hover { transform: scale(1.1); box-shadow: 0 0 12px rgba(220, 53, 69, 0.8); }

        .tooltip-text {
            visibility: hidden;
            width: 230px;
            background-color: #120e24;
            color: #fff;
            text-align: left;
            border-radius: 8px;
            padding: 12px;
            position: absolute;
            z-index: 10;
            bottom: 125%;
            left: 50%;
            margin-left: -115px;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 12px;
            pointer-events: none;
        }
        .seat-wrapper:hover .tooltip-text { visibility: visible; opacity: 1; }

        .model { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .model-content { background: #1a1532; border: 1px solid rgba(255, 255, 255, 0.15); padding: 30px; border-radius: 12px; width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .btn-model { display: block; width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-cancel-single { background-color: #ff9800; color: #120e24; }
        .btn-cancel-all { background-color: #dc3545; color: white; }
        .btn-close { background-color: #6c757d; color: white; }
    </style>
</head>
<body>

<div class="container">
    <a href="/admin" style="float: left; color: #ffc107; text-decoration: none; font-weight: bold;">← Powrót do Panelu Admina</a>
    <br><br>

    <h1>Podgląd miejsc sali</h1>
    <h3 th:text="${screening.movie.title} + ' - ' + ${screening.cinemaHall.name}" style="color: #fff;">Film - Sala</h3>

    <div class="screen">EKRAN KINOWY</div>

    <div class="screen-grid">
        <div th:each="rowNum : ${#numbers.sequence(1, screening.cinemaHall.totalRows)}" class="seat-row">
            <span class="row-label" th:text="'Rząd ' + ${rowNum}">Rząd 1</span>

            <th:block th:each="seat : ${seats}" th:if="${seat.rowNumber == rowNum}">
                <div class="seat-wrapper" th:with="dto=${seatTicketMap.get(seat.id)}">

                    <div class="seat-box"
                         th:classappend="${dto != null} ? 'occupied' : 'free'"
                         th:data-ticket-id="${dto != null} ? ${dto.ticketId} : ''"
                         th:data-email="${dto != null} ? ${dto.customerEmail} : ''"
                         onclick="handleSeatClick(this)"
                         th:text="${seat.seatNumber}">
                        1
                    </div>

                    <div th:if="${dto != null}" class="tooltip-text">
                        <strong style="color: #ffc107;">Rezerwacja Biletowa</strong><br>
                        👤 <strong>Klient:</strong> <span th:text="${dto.customerEmail}">email</span><br>
                        📅 <strong>Złożono:</strong> <span th:text="${#temporals.format(dto.reservationTime, 'yyyy-MM-dd HH:mm')}">Data</span><br>
                        ⚠️ <em>Kliknij fotel, aby anulować</em>
                    </div>

                </div>
            </th:block>
        </div>
    </div>
</div>

<!-- model okna anulowania miejsc -->
<div id="cancelModel" class="model">
    <div class="model-content">
        <h3 style="color: #fff; margin-top: 0;">Anulowanie Rezerwacji</h3>
        <p style="color: #aaa; font-size: 14px;">Wybierz zakres anulowania dla użytkownika:<br><strong id="modelUserEmail" style="color: #ffc107;"></strong></p>

        <!-- gormularz 1: snulowanie pojedynczego miejsca (th:action uzupelniane dynamicznie przez JS) -->
        <form id="cancelSingleForm" method="post">
            <!-- Dodajemy jawny token CSRF dla Spring Security -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="screeningId" th:value="${screening.id}">
            <button type="submit" class="btn-model btn-cancel-single">Anuluj TYLKO to wybrane miejsce</button>
        </form>

        <!-- gormularz 2: snulowanie wszystkich miejsc uzytkownika -->
        <form id="cancelAllForm" th:action="@{/admin/tickets/cancel-all}" method="post">
            <!-- dodanie jawnego tokenu CSRF dla Spring Security -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="screeningId" th:value="${screening.id}">
            <input type="hidden" id="modelInputEmail" name="customerEmail">
            <button type="submit" class="btn-model btn-cancel-all">Anuluj WSZYSTKIE miejsca tego klienta</button>
        </form>

        <button type="button" class="btn-model btn-close" onclick="closeCancelModel()">Zamknij</button>
    </div>
</div>

<script>
    function handleSeatClick(element) {
        if (!element.classList.contains('occupied')) return;

        const ticketId = element.getAttribute('data-ticket-id');
        const customerEmail = element.getAttribute('data-email');

        document.getElementById('modelUserEmail').innerText = customerEmail;
        document.getElementById('modelInputEmail').value = customerEmail;

        document.getElementById('cancelSingleForm').action = '/admin/tickets/cancel-single/' + ticketId;
        document.getElementById('cancelModel').style.display = 'flex';
    }

    function closeCancelModel() {
        document.getElementById('cancelModel').style.display = 'none';
    }
</script>

</body>
</html>
