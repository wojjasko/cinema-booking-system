<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Zaplanuj Seans - Panel Admina</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #06040a 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 0;
    }

    .form-card {
      background: rgba(25, 20, 45, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 480px;
      backdrop-filter: blur(12px);
    }

    h1 { text-align: center; color: #ffffff; margin-top: 0; margin-bottom: 25px; font-size: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: #b0b0ca; font-weight: 500; }

    select, input[type="datetime-local"], input[type="number"] {
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: rgba(10, 8, 22, 0.7);
      color: #ffffff;
      box-sizing: border-box;
      font-size: 14px;
    }

    select option { background-color: #15102a; color: white; }

    select:focus, input:focus {
      outline: none;
      border-color: #ffc107;
      box-shadow: 0 0 12px rgba(255, 193, 7, 0.35);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
      border: none;
      border-radius: 8px;
      color: #120e24;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(255, 193, 7, 0.25);
      margin-top: 10px;
    }

    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 193, 7, 0.45); }

    .alert-error {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
      background-color: rgba(220, 53, 69, 0.25);
      border: 1px solid #ff4d4d;
      color: #ff8080;
    }

    .link-back { display: block; text-align: center; margin-top: 20px; color: #a0a0c0; text-decoration: none; font-size: 14px; }
    .link-back:hover { color: #ffffff; }
  </style>
</head>
<body>

<div class="form-card">
  <h1>🗓️ Zaplanuj Seans</h1>

  <!-- Komunikat walidacji nakładania się seansów -->
  <div th:if="${errorMessage}" class="alert-error">
    ⚠️ <span th:text="${errorMessage}">Błąd kolizji seansów!</span>
  </div>

  <form th:action="@{/admin/screenings/add}" method="post">
    <div class="form-group">
      <label>Wybierz Film</label>
      <select name="movie.id" required>
        <option value="" disabled selected>-- Wybierz film z listy --</option>
        <option th:each="m : ${movies}" th:value="${m.id}" th:text="${m.title} + ' (' + ${m.durationMinutes} + ' min)'">Film</option>
      </select>
    </div>

    <div class="form-group">
      <label>Wybierz Salę Kinową</label>
      <select name="cinemaHall.id" required>
        <option value="" disabled selected>-- Wybierz salę --</option>
        <option th:each="h : ${halls}" th:value="${h.id}" th:text="${h.name}"></option>
      </select>
    </div>

    <div class="form-group">
      <label>Data i Godzina Rozpoczęcia</label>
      <input type="datetime-local" name="startTime" required>
    </div>

    <div class="form-group">
      <label>Cena Biletu (PLN)</label>
      <input type="number" step="0.01" name="price" required placeholder="25.00">
    </div>

    <button type="submit" class="btn-submit">ZAPISZ SEANS W REPERTUARZE</button>
  </form>

  <a href="/admin" class="link-back">← Powrót do Panelu Admina</a>
</div>

</body>
</html>
