<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Logowanie - MojeKino</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #06040a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            background: rgba(25, 20, 45, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 45px 40px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 193, 7, 0.05);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(12px);
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 26px;
        }

        .form-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #b0b0ca; font-weight: 500; }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 13px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background-color: rgba(10, 8, 22, 0.7);
            color: #ffffff;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.25s ease;
        }

        input:focus {
            outline: none;
            border-color: #ffc107;
            box-shadow: 0 0 12px rgba(255, 193, 7, 0.35);
            background-color: rgba(15, 12, 32, 0.9);
        }

        .btn-custom {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            border: none;
            border-radius: 8px;
            color: #120e24;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.25);
            margin-top: 10px;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 193, 7, 0.45);
            background: linear-gradient(135deg, #ffd043 0%, #ffa726 100%);
        }

        .alert { padding: 12px; border-radius: 8px; margin-bottom: 22px; font-size: 14px; text-align: center; }
        .alert-error { background-color: rgba(220, 53, 69, 0.25); border: 1px solid #ff4d4d; color: #ff8080; }
        .alert-success { background-color: rgba(40, 167, 69, 0.25); border: 1px solid #28a745; color: #66ef84; }

        .footer-text {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
            color: #d0d0e5;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 20px;
        }

        .link-highlight {
            color: #ffc107;
            text-decoration: none;
            font-weight: 700;
            margin-left: 5px;
            transition: color 0.2s;
        }

        .link-highlight:hover {
            color: #ffe082;
            text-decoration: underline;
        }

        .link-back {
            display: inline-block;
            margin-top: 12px;
            color: #a0a0c0;
            text-decoration: none;
            font-size: 13px;
        }

        .link-back:hover { color: #ffffff; }
    </style>
</head>
<body>

<div class="auth-card">
    <h2>Logowanie</h2>

    <div th:if="${param.error}" class="alert alert-error">
        Nieprawidłowy e-mail lub hasło!
    </div>
    <div th:if="${param.registered}" class="alert alert-success">
        Konto utworzone! Możesz się zalogować.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Adres E-mail</label>
            <input type="email" name="username" required placeholder="xxx@email.com">
        </div>

        <div class="form-group">
            <label>Hasło</label>
            <input type="password" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-custom">ZALOGUJ SIĘ</button>
    </form>

    <div class="footer-text">
        <span>Nie masz jeszcze konta?</span>
        <a href="/register" class="link-highlight">Zarejestruj się</a>
        <br>
        <a href="/" class="link-back">← Powrót do strony głównej</a>
    </div>
</div>

</body>
</html>
