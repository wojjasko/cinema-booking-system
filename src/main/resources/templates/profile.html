<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Moje Konto - MojeKino</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0c20; color: #e0e0e0; margin: 0; padding-bottom: 50px; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }

        .tab-menu { display: flex; gap: 15px; border-bottom: 2px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        .tab-btn { padding: 12px 24px; background: none; border: none; color: #888; font-size: 16px; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
        .tab-btn.active { color: #ffc107; border-bottom-color: #ffc107; }

        .card { background: rgba(30, 26, 54, 0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 30px; margin-bottom: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); color: white; box-sizing: border-box; outline: none; }
        input:focus { border-color: #ffc107; }

        .btn-submit { display: none; margin-top: 20px; width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-submit.visible { display: block; animation: fadeIn 0.3s forwards; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
        .alert-success { background: rgba(40, 167, 69, 0.2); border: 1px solid #28a745; color: #28a745; }
        .alert-error { background: rgba(220, 53, 69, 0.2); border: 1px solid #dc3545; color: #dc3545; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('details', event)">👤 Dane osobowe</button>
        <button class="tab-btn" onclick="switchTab('security', event)">🔑 Zmiana hasła</button>
        <button class="tab-btn" onclick="window.location.href='/my-reservations'">🎟️ Moje rezerwacje</button>
    </div>

    <!-- 1. PERSONAL DATA -->
    <div id="details-tab" class="card">
        <h2 style="margin-top: 0;">Dane Osobowe</h2>
        <form th:action="@{/profile/update-details}" th:object="${profileDto}" method="post">
            <div class="form-group">
                <label>Imię</label>
                <input type="text" th:field="*{firstName}" class="details-input" />
            </div>
            <div class="form-group">
                <label>Nazwisko</label>
                <input type="text" th:field="*{lastName}" class="details-input" />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" class="details-input" />
            </div>
            <div class="form-group">
                <label>Numer Telefonu</label>
                <input type="text" th:field="*{phoneNumber}" class="details-input" placeholder="+48 000 000 000" />
            </div>

            <button type="submit" id="updateDetailsBtn" class="btn-submit">💾 Zaktualizuj Dane</button>
        </form>
    </div>

    <!-- 2. PASSWORD CHANGE -->
    <div id="security-tab" class="card" style="display: none;">
        <h2 style="margin-top: 0;">Zmiana hasła</h2>
        <form th:action="@{/profile/change-password}" th:object="${passwordDto}" method="post">
            <div class="form-group">
                <label>Aktualne hasło</label>
                <input type="password" th:field="*{currentPassword}" class="password-input" required />
            </div>
            <div class="form-group">
                <label>Nowe hasło</label>
                <input type="password" th:field="*{newPassword}" class="password-input" required />
            </div>

            <button type="submit" id="updatePasswordBtn" class="btn-submit">🔒 Zaktualizuj hasło</button>
        </form>
    </div>

</div>

<script>
    function switchTab(tab, evt) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (tab === 'details') {
            document.getElementById('details-tab').style.display = 'block';
            document.getElementById('security-tab').style.display = 'none';
        } else if (tab === 'security') {
            document.getElementById('details-tab').style.display = 'none';
            document.getElementById('security-tab').style.display = 'block';
        }
        evt.target.classList.add('active');
    }

    const detailsInputs = document.querySelectorAll('.details-input');
    const updateDetailsBtn = document.getElementById('updateDetailsBtn');

    detailsInputs.forEach(input => {
        input.addEventListener('input', () => {
            updateDetailsBtn.classList.add('visible');
        });
    });

    const passwordInputs = document.querySelectorAll('.password-input');
    const updatePasswordBtn = document.getElementById('updatePasswordBtn');

    passwordInputs.forEach(input => {
        input.addEventListener('input', () => {
            const currentPass = passwordInputs[0].value.trim();
            const newPass = passwordInputs[1].value.trim();
            if (currentPass.length > 0 && newPass.length > 0) {
                updatePasswordBtn.classList.add('visible');
            } else {
                updatePasswordBtn.classList.remove('visible');
            }
        });
    });
</script>

</body>
</html>
